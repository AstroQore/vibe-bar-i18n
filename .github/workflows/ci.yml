name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No path filter on pull requests: these are required checks, and a
  # filtered workflow never reports on a docs-only change, so the branch
  # rule waits forever for a run that cannot start.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. The catalog holds together on its own terms: schema, key parity,
  #    metadata placement, ICU syntax, placeholder parity, glossary.
  #    `--skip-generated` so this job reports catalog problems even when
  #    the generated tree is also stale — one cause, one message.
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: python3 --version
      - name: Validate
        run: python3 scripts/validate.py --skip-generated

  # 2. The checked-in generated files are exactly what the catalog
  #    produces. Regenerating must be a no-op; anything else means somebody
  #    edited generated output or forgot to re-run the generator.
  generate-and-diff:
    name: Generated files are current
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate
        run: python3 scripts/generate.py
      - name: Fail if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::scripts/generate.py produced different output than what is committed."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
      - name: Validate including freshness
        run: python3 scripts/validate.py

  # 3. The Swift lane, on the OS the consuming app targets. macos-26
  #    matches AstroQore/vibe-bar and AstroQore/agent-session-kit; an older
  #    image fails loudly on the SDK rather than testing something else.
  swift-test:
    name: Swift lane
    runs-on: macos-26
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  # 4. The TypeScript lane. `tsc` proves the type-level claims — including
  #    the `@ts-expect-error` assertions in typetests/, which fail the build
  #    if a wrong key or a missing placeholder ever stops being an error.
  #    It is fetched with npx rather than installed, so the package itself
  #    keeps zero dependencies.
  node-test:
    name: TypeScript lane
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18 is the first release that strips TypeScript types without
          # a flag, which is what lets `node --test` run the lane from
          # source with nothing installed.
          node-version: "22"
      - name: Type-check
        run: npx -y -p typescript@5.9.3 tsc --noEmit -p implementations/typescript
      - name: Test
        run: npm test

  # 5. A release tag and the npm version are two numbers with no shared
  #    source of truth, and an npm consumer pinned to a version that was
  #    never published finds out at install time. Tie them together here,
  #    which is the only moment both exist.
  release-version:
    name: Tag matches package.json
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg — bump both in the release commit (AGENTS.md § 7)"
            exit 1
          fi
          echo "v$tag matches package.json"
